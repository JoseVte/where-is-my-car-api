services:
  mysql:
    image: 'mysql:latest'
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    # Only started with `docker compose --profile app up --build`. Without the profile, Spring Boot's
    # docker compose support (used when running the API from the IDE) only starts mysql.
    profiles: ['app']
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID in .env}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:?Set FIREBASE_API_KEY in .env}
      FIREBASE_CREDENTIALS_PATH: file:/run/secrets/firebase-credentials.json
      SEED_EMAIL: ${SEED_EMAIL:-}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    volumes:
      - ./firebase-credentials.json:/run/secrets/firebase-credentials.json:ro

volumes:
  mysql_data:
