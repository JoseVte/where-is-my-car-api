spring.application.name=whereismycar
spring.config.import=optional:file:./.env[.properties]

spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true
spring.devtools.restart.exclude=static/**,public/**,resources/**,META-INF/**,templates/**,application.properties
spring.devtools.restart.poll-interval=1000
spring.docker.compose.lifecycle-management=start-only

debug=${APP_DEBUG:false}

# Local MySQL from compose.yaml (host port 3307). Inside Docker the SPRING_DATASOURCE_* variables override these.
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/${DB_NAME:whereismycar}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# i18n: messages*.properties, language chosen from Accept-Language (see LocaleConfig)
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

firebase.project-id=${FIREBASE_PROJECT_ID}
firebase.api-key=${FIREBASE_API_KEY}
firebase.credentials=${FIREBASE_CREDENTIALS_PATH:file:./firebase-credentials.json}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# Registrations allowed per client IP and period (ISO 8601 duration). Behind a reverse proxy, also set
# server.forward-headers-strategy=native, otherwise every client shares the proxy IP and its limit.
app.rate-limit.register.capacity=${REGISTER_RATE_LIMIT_CAPACITY:5}
app.rate-limit.register.period=${REGISTER_RATE_LIMIT_PERIOD:PT1H}

app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.email=${SEED_EMAIL:}
app.seed.password=${SEED_PASSWORD:}
