# Test profile. The database comes from Testcontainers (@ServiceConnection overrides these values) and
# Firebase is mocked, so no .env, credentials or network access are needed.
spring.datasource.url=jdbc:mysql://localhost/overridden-by-testcontainers
spring.datasource.username=test
spring.datasource.password=test
spring.jpa.hibernate.ddl-auto=create-drop

firebase.project-id=test-project
firebase.api-key=test-key
firebase.credentials=classpath:does-not-exist.json

app.seed.enabled=false
app.cors.allowed-origins=http://localhost:4200
debug=false
